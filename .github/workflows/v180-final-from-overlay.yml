name: Guoyu v1.8.0 Final Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guoyu-v180-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble verified v1.7 base source
        shell: bash
        run: |
          set -euo pipefail
          cat build-source/part-* > "$RUNNER_TEMP/base.b64"
          test "$(wc -c < "$RUNNER_TEMP/base.b64")" -eq 120008
          base64 --decode "$RUNNER_TEMP/base.b64" > "$RUNNER_TEMP/base.tar.xz"
          echo "49b5dbf6db5013203bf9364786f171b6fe3719ac5e07646fbdac367009712d44  $RUNNER_TEMP/base.tar.xz" | sha256sum -c -
          xz -t "$RUNNER_TEMP/base.tar.xz"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/base.tar.xz" -C "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/composer.json"
          test -f "$RUNNER_TEMP/source/package.json"

      - name: Reassemble and apply final v1.8 overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(find v18-overlay5 -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 20
          cat v18-overlay5/part-* > "$RUNNER_TEMP/overlay.b64"
          base64 --decode "$RUNNER_TEMP/overlay.b64" > "$RUNNER_TEMP/overlay.tar.xz"
          xz -t "$RUNNER_TEMP/overlay.tar.xz"
          sha256sum "$RUNNER_TEMP/overlay.tar.xz" | tee "$GITHUB_WORKSPACE/v180-overlay.sha256"
          tar -xJf "$RUNNER_TEMP/overlay.tar.xz" -C "$RUNNER_TEMP/source"
          test "$(cat "$RUNNER_TEMP/source/VERSION")" = "1.8.0"
          test -f "$RUNNER_TEMP/source/database/migrations/2026_07_27_000570_create_content_engagement_support_tables.php"
          test -f "$RUNNER_TEMP/source/tools/content-engagement-support-smoke.php"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, ctype, json, curl, openssl, zip, pdo, pdo_sqlite, sqlite3, fileinfo, tokenizer, gd, bcmath
          tools: composer:v2
          coverage: none

      - name: Align Laravel 13 Composer constraints
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          set -euo pipefail
          php -r '
          $path = "composer.json";
          $json = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $json["require"]["laravel/framework"] = "^13.8";
          $json["require"]["laravel/tinker"] = "^3.0";
          $json["require-dev"]["laravel/pail"] = "^1.2.5";
          $json["require-dev"]["laravel/pint"] = "^1.27";
          $json["require-dev"]["nunomaduro/collision"] = "^8.6";
          $json["require-dev"]["phpunit/phpunit"] = "^12.5.12";
          file_put_contents($path, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . PHP_EOL);
          '
          composer validate --no-check-publish --strict

      - name: Install PHP dependencies
        working-directory: ${{ runner.temp }}/source
        run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare Laravel testing environment
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan config:clear

      - name: Run release verification
        working-directory: ${{ runner.temp }}/source
        run: bash tools/verify-release.sh

      - name: Run migrations and production seeder
        working-directory: ${{ runner.temp }}/source
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/source/database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --seed --force

      - name: Run Laravel tests
        working-directory: ${{ runner.temp }}/source
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/source/database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: ${{ runner.temp }}/source
        run: npm install --include=dev --no-audit --no-fund

      - name: Typecheck web
        working-directory: ${{ runner.temp }}/source
        run: npm run typecheck

      - name: Build web
        working-directory: ${{ runner.temp }}/source
        run: npm run build

      - name: Install mobile dependencies
        working-directory: ${{ runner.temp }}/source/mobile
        run: npm install --include=dev --no-audit --no-fund

      - name: Typecheck mobile
        working-directory: ${{ runner.temp }}/source/mobile
        run: npm run typecheck

      - name: Export Expo web
        working-directory: ${{ runner.temp }}/source/mobile
        run: npx expo export --platform web

      - name: Verify production outputs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/source"
          test -f "$SOURCE/vendor/autoload.php"
          test -f "$SOURCE/public/build/manifest.json"
          test -f "$SOURCE/composer.lock"
          test -f "$SOURCE/package-lock.json"
          test -f "$SOURCE/mobile/package-lock.json"
          test -d "$SOURCE/mobile/dist"

      - name: Prepare built source and runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/source"
          rm -f "$SOURCE/.env" "$SOURCE/database/database.sqlite"
          rm -rf "$SOURCE/node_modules" "$SOURCE/mobile/node_modules"
          find "$SOURCE/storage" -type f ! -name '.gitignore' -delete || true
          find "$SOURCE/bootstrap/cache" -type f ! -name '.gitignore' -delete || true

          cd "$SOURCE"
          zip -qr "$GITHUB_WORKSPACE/guoyu-platform-v1.8.0-built-source.zip" .
          sha256sum "$GITHUB_WORKSPACE/guoyu-platform-v1.8.0-built-source.zip" > "$GITHUB_WORKSPACE/guoyu-platform-v1.8.0-built-source.zip.sha256"

          OUT="$RUNNER_TEMP/runtime"
          mkdir -p "$OUT/guoyu-app" "$OUT/public_html" "$OUT/mobile"
          cp -a "$SOURCE/vendor" "$OUT/guoyu-app/vendor"
          cp -a "$SOURCE/public/build" "$OUT/public_html/build"
          cp "$SOURCE/composer.lock" "$OUT/guoyu-app/composer.lock"
          cp "$SOURCE/package-lock.json" "$OUT/guoyu-app/package-lock.json"
          cp "$SOURCE/mobile/package-lock.json" "$OUT/mobile/package-lock.json"
          cd "$OUT"
          zip -qr "$GITHUB_WORKSPACE/guoyu-runtime-v1.8.0-unsigned.zip" .
          sha256sum "$GITHUB_WORKSPACE/guoyu-runtime-v1.8.0-unsigned.zip" > "$GITHUB_WORKSPACE/guoyu-runtime-v1.8.0-unsigned.zip.sha256"

      - name: Upload built source
        uses: actions/upload-artifact@v4
        with:
          name: guoyu-platform-v1.8.0-built-source
          path: |
            guoyu-platform-v1.8.0-built-source.zip
            guoyu-platform-v1.8.0-built-source.zip.sha256
            v180-overlay.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: guoyu-runtime-v1.8.0-unsigned
          path: |
            guoyu-runtime-v1.8.0-unsigned.zip
            guoyu-runtime-v1.8.0-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guoyu-v1.8.0-failure-diagnostics
          path: |
            ${{ runner.temp }}/source/storage/logs/*.log
            v180-overlay.sha256
          if-no-files-found: warn
          retention-days: 7
