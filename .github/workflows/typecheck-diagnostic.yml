name: Typecheck Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guoyu-typecheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and verify build source
        shell: bash
        run: |
          set -euo pipefail
          cat build-source/part-* > "$RUNNER_TEMP/source.b64"
          test "$(wc -c < "$RUNNER_TEMP/source.b64")" -eq 120008
          base64 --decode "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.tar.xz"
          echo "49b5dbf6db5013203bf9364786f171b6fe3719ac5e07646fbdac367009712d44  $RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/source"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: ${{ runner.temp }}/source
        run: npm install --include=dev --no-audit --no-fund

      - name: Apply strict Inertia 3 compatibility migration
        working-directory: ${{ runner.temp }}/source
        run: python3 "$GITHUB_WORKSPACE/ci/apply_inertia3_compat.py"

      - name: Run TypeScript and save complete report
        id: typecheck
        continue-on-error: true
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck -- --pretty false 2>&1 | tee "$GITHUB_WORKSPACE/typecheck.log"

      - name: Upload complete TypeScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guoyu-typecheck-diagnostic
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Print complete TypeScript report
        if: always()
        run: cat typecheck.log

      - name: Fail when TypeScript has errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
