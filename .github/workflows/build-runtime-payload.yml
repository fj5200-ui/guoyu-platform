name: Build Runtime Payload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-source/**'
      - '.github/workflows/build-runtime-payload.yml'

permissions:
  contents: read

concurrency:
  group: guoyu-runtime-v1.7.1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and verify build source
        shell: bash
        run: |
          set -euo pipefail
          test -d build-source
          cat build-source/part-* > "$RUNNER_TEMP/source.b64"
          test "$(wc -c < "$RUNNER_TEMP/source.b64")" -eq 120008
          base64 --decode "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.tar.xz"
          echo "49b5dbf6db5013203bf9364786f171b6fe3719ac5e07646fbdac367009712d44  $RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/composer.json"
          test -f "$RUNNER_TEMP/source/package.json"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, curl, openssl, zip, pdo
          tools: composer:v2
          coverage: none

      - name: Align Composer constraints with Laravel 13
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          set -euo pipefail
          php -r '
          $path = "composer.json";
          $json = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $json["require"]["laravel/framework"] = "^13.8";
          $json["require"]["laravel/tinker"] = "^3.0";
          $json["require-dev"]["laravel/pail"] = "^1.2.5";
          $json["require-dev"]["laravel/pint"] = "^1.27";
          $json["require-dev"]["nunomaduro/collision"] = "^8.6";
          $json["require-dev"]["phpunit/phpunit"] = "^12.5.12";
          file_put_contents($path, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . PHP_EOL);
          '
          composer validate --no-check-publish --strict

      - name: Install production Composer runtime
        working-directory: ${{ runner.temp }}/source
        run: composer update --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress --no-scripts --with-all-dependencies

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies and create lock file
        working-directory: ${{ runner.temp }}/source
        run: npm install --include=dev --no-audit --no-fund

      - name: Align Inertia 3 frontend types
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          set -euo pipefail
          cat > resources/js/app.tsx <<'TSX'
          import '../css/app.css';

          import { createInertiaApp, type ResolvedComponent } from '@inertiajs/react';
          import { createRoot } from 'react-dom/client';
          import { Toaster } from 'sonner';

          const pages = import.meta.glob<ResolvedComponent>('./pages/**/*.tsx');

          createInertiaApp({
            strictMode: true,
            progress: {
              color: 'var(--brand-primary)',
            },
            resolve: (name) => {
              const resolvePage = pages[`./pages/${name}.tsx`];

              if (!resolvePage) {
                throw new Error(`Page not found: ${name}`);
              }

              return resolvePage();
            },
            setup({ el, App, props }) {
              if (!el) {
                throw new Error('Inertia root element was not found.');
              }

              createRoot(el).render(
                <>
                  <App {...props} />
                  <Toaster richColors position="top-center" />
                </>,
              );
            },
          });
          TSX

          cat > resources/js/ssr.tsx <<'TSX'
          import { createInertiaApp, type ResolvedComponent } from '@inertiajs/react';
          import createServer from '@inertiajs/react/server';
          import ReactDOMServer from 'react-dom/server';

          const pages = import.meta.glob<ResolvedComponent>('./pages/**/*.tsx');

          createServer((page) =>
            createInertiaApp({
              page,
              render: ReactDOMServer.renderToString,
              resolve: (name) => {
                const resolvePage = pages[`./pages/${name}.tsx`];

                if (!resolvePage) {
                  throw new Error(`Inertia page not found: ${name}`);
                }

                return resolvePage();
              },
              setup: ({ App, props }) => <App {...props} />,
            }),
          );
          TSX

          python3 - <<'PY'
          from pathlib import Path

          navigation = Path('resources/js/pages/Admin/Navigation/Index.tsx')
          text = navigation.read_text()
          text = text.replace(
              "type NavRow = NavigationItem & { sort_order: number; is_active: boolean };",
              "type VisibilityValue = string | number | boolean | null;\n"
              "type NavRow = Omit<NavigationItem, 'children' | 'visibility'> & {\n"
              "  sort_order: number;\n"
              "  is_active: boolean;\n"
              "  visibility: Record<string, VisibilityValue>;\n"
              "};",
          )
          text = text.replace(
              "visibility: item.visibility ?? {},",
              "visibility: (item.visibility ?? {}) as Record<string, VisibilityValue>,",
          )
          navigation.write_text(text)

          seller = Path('resources/js/pages/Admin/Sellers/Edit.tsx')
          text = seller.read_text().replace(
              'metadata: Record<string, unknown>;',
              'metadata: Record<string, string | number | boolean | null>;',
          )
          seller.write_text(text)
          PY

      - name: Typecheck frontend
        id: typecheck
        continue-on-error: true
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck -- --pretty false 2>&1 | tee "$GITHUB_WORKSPACE/typecheck.log"

      - name: Upload TypeScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guoyu-typecheck-v1.7.1
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Build frontend
        working-directory: ${{ runner.temp }}/source
        run: npm run build

      - name: Verify runtime outputs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/source"
          test -f "$SOURCE/vendor/autoload.php"
          test -f "$SOURCE/public/build/manifest.json"
          test -f "$SOURCE/composer.lock"
          test -f "$SOURCE/package-lock.json"
          php -r '$j=json_decode(file_get_contents(getenv("RUNNER_TEMP")."/source/composer.json"), true, 512, JSON_THROW_ON_ERROR); if (($j["require"]["laravel/tinker"] ?? null) !== "^3.0") { exit(1); }'

      - name: Package unsigned runtime payload
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/source"
          OUT="$RUNNER_TEMP/runtime-payload"
          mkdir -p "$OUT/guoyu-app" "$OUT/public_html"
          cp -a "$SOURCE/vendor" "$OUT/guoyu-app/vendor"
          cp -a "$SOURCE/public/build" "$OUT/public_html/build"
          cp "$SOURCE/composer.lock" "$OUT/guoyu-app/composer.lock"
          cp "$SOURCE/package-lock.json" "$OUT/guoyu-app/package-lock.json"
          cd "$OUT"
          zip -qr "$GITHUB_WORKSPACE/guoyu-runtime-payload-v1.7.1-unsigned.zip" .
          sha256sum "$GITHUB_WORKSPACE/guoyu-runtime-payload-v1.7.1-unsigned.zip" > "$GITHUB_WORKSPACE/guoyu-runtime-payload-v1.7.1-unsigned.zip.sha256"

      - name: Upload unsigned runtime payload
        uses: actions/upload-artifact@v4
        with:
          name: guoyu-runtime-payload-v1.7.1-unsigned
          path: |
            guoyu-runtime-payload-v1.7.1-unsigned.zip
            guoyu-runtime-payload-v1.7.1-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 7
